name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:deploy
      - run: npm run test:devices
      - run: npm run test:automation
      - run: npm run test:release
      - run: npm run test:domain
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  native-development:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # No user credentials, paid AI or provider access; real Seatbelt + synthetic app.
      # Always report completed assertions even if a failed synthetic child kept a pipe open.
      - run: node --test --test-force-exit tests/development-runtime.test.mjs tests/interpreter-preview.test.mjs
      # Homebrew dynamically links Node to libraries outside its formula directory.
      # Official setup-node binaries alone cannot verify this user environment.
      - run: brew install node
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: Homebrew Node native startup and isolation
        if: ${{ !cancelled() }}
        run: '"$(brew --prefix node)/bin/node" --test --test-force-exit tests/development-runtime.test.mjs tests/interpreter-preview.test.mjs'

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, storage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The Azure Ubuntu mirror stalled before tests in run 39877396082.
      # Keep Ubuntu's signed repositories and all browser checks.
      - name: Use the canonical Ubuntu package mirror
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          cat /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium webkit
      # No environment secrets: each suite builds a disposable, local-only app.
      - run: npm run test:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  server-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use the canonical Ubuntu package mirror
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          cat /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium
      # Disposable local Docker Supabase; no production variables or secrets.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:preview
      - run: npm run test:remote-preview
      - run: npm run db:start
      - run: npm run test:server
      - run: npm run db:stop
        if: always()
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: local-server-storage
          path: |
            test-results/server-storage.log
            test-results/server.log
            test-results/device-*.png
            test-results/other-owner.png
            test-results/large-transfer-failure.png
            test-results/project-lifecycle-*.png
          retention-days: 7
          if-no-files-found: warn
